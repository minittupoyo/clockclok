<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Signage Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts: Inter, Noto Sans JP, Geist Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700;800&family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Fullscreen Toggle Button -->
  <button id="fullscreen-btn" class="fullscreen-toggle hidden" aria-label="Toggle Fullscreen">
    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <svg class="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
    </svg>
  </button>

  <!-- Fullscreen Digital Signage Container -->
  <div class="signage-lcd">
    
    <!-- Top Weather & System Info Header -->
    <header class="signage-header">
      <div class="header-weather">
        <span class="weather-icon" id="weather-icon">☀️</span>
        <span class="weather-text" id="weather-desc">晴れ</span>
        <span class="weather-temp" id="weather-temp">27°C</span>
      </div>
      <div class="header-status">
        <span class="live-dot"></span>
        <span class="live-label">LIVE</span>
      </div>
    </header>

    <!-- Main Section: Dynamic Seconds Display (70% Allocation) -->
    <section class="seconds-panel">
      <div class="seconds-display-box">
        <span class="seconds-num" id="seconds-large">00</span>
        <span class="seconds-unit">SEC</span>
      </div>
    </section>

    <div class="signage-divider"></div>

    <!-- Clock & Calendar Section (30% Allocation) -->
    <section class="clock-panel">
      <div class="time-readout">
        <span id="hours">00</span>
        <span class="time-colon">:</span>
        <span id="minutes">00</span>
      </div>

      <div class="date-readout">
        <span id="date-full">2026.08.12</span>
        <span class="date-sep">|</span>
        <span id="day-japanese">水曜日</span>
      </div>
    </section>

    <!-- Bottom Real-time News Ticker -->
    <footer class="signage-footer">
      <div class="news-badge">ニュース</div>
      <div class="news-wrapper">
        <div class="news-text" id="news-ticker">
          最新ニュースを取得中...
        </div>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
