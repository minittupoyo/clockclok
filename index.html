<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Signage Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts: Inter, Noto Sans JP, Geist Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Fullscreen Toggle Button -->
  <button id="fullscreen-btn" class="fullscreen-toggle hidden" aria-label="Toggle Fullscreen">
    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <svg class="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
    </svg>
  </button>

  <!-- Fullscreen Digital Signage Container -->
  <div class="signage-lcd">
    
    <!-- Weather Forecast Section (40% Ratio - Apple Weather Style App Widget) -->
    <section class="weather-section-four">
      
      <!-- Weather Hero Main Row -->
      <div class="weather-app-hero">
        <div class="weather-hero-main">
          <span class="weather-app-icon" id="weather-icon">☀️</span>
          <div class="weather-app-temp-wrap">
            <span class="weather-app-temp" id="weather-temp">27°</span>
            <span class="weather-app-desc" id="weather-desc">晴れ</span>
          </div>
        </div>

        <!-- Weather Sub Metrics (High/Low & Rain/Humidity) -->
        <div class="weather-app-metrics">
          <div class="metric-row hi-low-row">
            <span class="metric-high" id="temp-high">最高 31°</span>
            <span class="metric-dot">•</span>
            <span class="metric-low" id="temp-low">最低 22°</span>
          </div>
          <div class="metric-row sub-row">
            <span class="metric-sub-item">降水確率 <strong id="pop-val">0%</strong></span>
            <span class="metric-dot">•</span>
            <span class="metric-sub-item">湿度 <strong id="humidity-val">55%</strong></span>
          </div>
        </div>
      </div>

      <!-- Hourly Forecast Timeline Widget -->
      <div class="weather-timeline-widget">
        <div class="timeline-header">時間帯別の予報</div>
        <div class="hourly-forecast-row" id="hourly-forecast">
          <div class="hourly-chip">
            <span class="chip-time">今</span>
            <span class="chip-icon">☀️</span>
            <span class="chip-temp">27°</span>
          </div>
          <div class="hourly-chip">
            <span class="chip-time">18時</span>
            <span class="chip-icon">☀️</span>
            <span class="chip-temp">26°</span>
          </div>
          <div class="hourly-chip">
            <span class="chip-time">21時</span>
            <span class="chip-icon">🌤️</span>
            <span class="chip-temp">24°</span>
          </div>
          <div class="hourly-chip">
            <span class="chip-time">00時</span>
            <span class="chip-icon">🌙</span>
            <span class="chip-temp">22°</span>
          </div>
          <div class="hourly-chip">
            <span class="chip-time">03時</span>
            <span class="chip-icon">🌙</span>
            <span class="chip-temp">21°</span>
          </div>
        </div>
      </div>

    </section>

    <div class="signage-divider"></div>

    <!-- Digital Clock Section (60% Ratio) -->
    <main class="clock-section-six">
      <div class="time-container">
        <div class="time-main">
          <span id="hours">00</span>
          <span class="time-colon">:</span>
          <span id="minutes">00</span>
        </div>
        <div class="seconds-box">
          <span id="seconds">00</span>
        </div>
      </div>

      <div class="date-container">
        <span id="date-full">2026.08.12</span>
        <span class="date-sep">|</span>
        <span id="day-japanese">水曜日</span>
      </div>
    </main>

    <!-- Bottom Real-time News Ticker (Unified Clean Marquee) -->
    <footer class="signage-footer">
      <div class="news-badge">ニュース</div>
      <div class="news-wrapper">
        <div class="news-text" id="news-ticker">
          最新ニュースを取得中...
        </div>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
